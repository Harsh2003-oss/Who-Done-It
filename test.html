<!DOCTYPE html>
<html>
<head>
    <title>Socket Test</title>
</head>
<body>

    <h1>Socket.IO Test</h1>

    <button id="start-game">Start Game</button>

    <label for="kill-target">Choose a player to kill:</label>

<select id="kill-target">
    <option value="">Select player</option>
</select>

<button id="kill-player">Submit Kill</button>


    <button id="resolve-night">Resolve Night</button>

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>

   


    <script>

let currentGame = null;

        const socket = io("http://localhost:3000");

        socket.on("connect", () => {
            console.log("Connected to server");
            console.log("Socket ID:", socket.id);

            const username = prompt("Enter your username:");

            if (!username) {
                console.log("Username was not entered");
                return;
            }

            socket.emit("room:join", {
                roomId: "ABC123",
                username: username
            });
        });

        socket.on("room:update", (data) => {
            console.log("Room update:", data.message);
            console.log("Players in room:", data.players);
            console.log("Total players:", data.players.length);
        });

        socket.on("room:joined", (data) => {
            console.log("Successfully joined room:", data.roomId);
            console.log("My player information:", data.player);
            console.log("Am I host?", data.isHost);
        });

        document.getElementById("start-game").addEventListener("click", () => {
            console.log("Start button clicked");
            socket.emit("game:start");
        });

        socket.on("game:started", (data) => {
    console.log("Game started:", data.game);

    currentGame = data.game;

    console.log("Players:", currentGame.players);

    updateTargetDropdown();
});

        socket.on("disconnect", () => {
            console.log("Disconnected from server");
        });

        socket.on("connect_error", (error) => {
            console.error("Connection error:", error);
        });

socket.on("role:assigned", (data) => {
    console.log("PRIVATE ROLE EVENT RECEIVED");
    console.log("My player ID:", data.playerId);
    console.log("My private role:", data.role);
});

document.getElementById("resolve-night").addEventListener("click", () => {
    console.log("Resolve Night clicked");
    socket.emit("night:resolve");
});

socket.on("night:resolved", (data) => {
    console.log("Night resolved by server");

    currentGame = data.game;

    console.log("Updated game:", currentGame);
    console.log("Current phase:", currentGame.phase);

    updateTargetDropdown();
});

document.getElementById("kill-player").addEventListener("click", () => {
    const targetPlayerId = document.getElementById("kill-target").value;

    if (!targetPlayerId) {
        console.log("Please select a player");
        return;
    }

    socket.emit("night:action", {
        action: "KILL",
        targetPlayerId: targetPlayerId
    });
});


function updateTargetDropdown() {
    const targetSelect = document.getElementById("kill-target");

    targetSelect.innerHTML = `
        <option value="">Select player</option>
    `;

    if (!currentGame) {
        return;
    }

    currentGame.players.forEach((player) => {
        const option = document.createElement("option");

        option.value = player.playerId;
        option.textContent = `${player.username} (${player.alive ? "Alive" : "Dead"})`;

        if (!player.alive) {
            option.disabled = true;
        }

        targetSelect.appendChild(option);
    });
}

    </script>

</body>
</html>
